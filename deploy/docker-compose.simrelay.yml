services:
  simrelay:
    image: simrelay:latest
    container_name: simrelay
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SIMRELAY_DEVICE: /dev/ttyUSB3
      SIMRELAY_BAUD: "115200"
      SIMRELAY_LISTEN: ":7575"
      SIMRELAY_TIMEOUT: 5s
      SIMRELAY_ADMIN_USERNAME: admin
      SIMRELAY_ADMIN_PASSWORD: ${SIMRELAY_ADMIN_PASSWORD:-admin}
      SIMRELAY_SENT_SMS_STORE: /var/lib/simrelay/sent-sms.json
      SIMRELAY_READ_SMS_STORE: /var/lib/simrelay/read-sms.json
      SIMRELAY_VOHIVE_DB: /var/lib/vohive/vohive.db
      SIMRELAY_QMI_DEVICE: /dev/cdc-wdm0
      SIMRELAY_NET_INTERFACE: wwp0s26f7u1i4
      SIMRELAY_QMI_TIMEOUT: 1s
      SIMRELAY_QMI_CACHE_TTL: 15s
      SIMRELAY_QMI_PROXY: "false"
    devices:
      - /dev/ttyUSB3:/dev/ttyUSB3
      - /dev/cdc-wdm0:/dev/cdc-wdm0
    ports:
      - "7576:7575"
    volumes:
      - simrelay-data:/var/lib/simrelay
      - /home/yupengsheng/vohive-docker/data:/var/lib/vohive:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7575/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  simrelay-data:
