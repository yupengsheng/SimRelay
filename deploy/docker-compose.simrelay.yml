services:
  simrelay:
    image: simrelay:latest
    container_name: simrelay
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SIMRELAY_DEVICE: /dev/ttyUSB2
      SIMRELAY_BAUD: "115200"
      SIMRELAY_LISTEN: ":7575"
      SIMRELAY_TIMEOUT: 5s
      SIMRELAY_ADMIN_USERNAME: admin
      SIMRELAY_ADMIN_PASSWORD: ${SIMRELAY_ADMIN_PASSWORD:-admin}
    devices:
      - /dev/ttyUSB2:/dev/ttyUSB2
    ports:
      - "7576:7575"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7575/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
