services:
  simrelay:
    build: .
    image: simrelay:latest
    container_name: simrelay
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SIMRELAY_DEVICE: /dev/ttyUSB3
      SIMRELAY_BAUD: "115200"
      SIMRELAY_LISTEN: ":7575"
      SIMRELAY_TIMEOUT: 5s
    devices:
      - /dev/ttyUSB3:/dev/ttyUSB3
    ports:
      - "7576:7575"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7575/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
